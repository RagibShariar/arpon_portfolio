<svg xmlns="http://www.w3.org/2000/svg" width="400" height="250" viewBox="0 0 400 250">
  <defs>
    <linearGradient id="gradeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6d28d9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chartGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:0.3" />
    </linearGradient>
    <linearGradient id="tableGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="250" fill="url(#gradeGradient)"/>
  
  <!-- Desktop application window -->
  <rect x="30" y="30" width="340" height="190" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
  
  <!-- Window header -->
  <rect x="30" y="30" width="340" height="30" rx="12" fill="#f3f4f6"/>
  <circle cx="50" cy="45" r="4" fill="#ef4444"/>
  <circle cx="65" cy="45" r="4" fill="#f59e0b"/>
  <circle cx="80" cy="45" r="4" fill="#10b981"/>
  <rect x="150" y="38" width="100" height="14" rx="7" fill="#6b7280"/>
  
  <!-- Main content area -->
  <rect x="40" y="70" width="320" height="140" rx="6" fill="#f9fafb"/>
  
  <!-- Student list/table -->
  <rect x="50" y="80" width="150" height="120" rx="4" fill="#ffffff" stroke="#e5e7eb"/>
  
  <!-- Table header -->
  <rect x="50" y="80" width="150" height="20" rx="4" fill="url(#tableGradient)"/>
  <text x="55" y="92" font-family="Arial" font-size="8" fill="#ffffff" font-weight="bold">Student Name</text>
  <text x="140" y="92" font-family="Arial" font-size="8" fill="#ffffff" font-weight="bold">Grade</text>
  
  <!-- Student rows -->
  <rect x="55" y="105" width="70" height="3" rx="1" fill="#374151"/>
  <rect x="140" y="105" width="20" height="3" rx="1" fill="#10b981"/>
  <text x="165" y="108" font-family="monospace" font-size="8" fill="#10b981">A</text>
  
  <rect x="55" y="115" width="80" height="3" rx="1" fill="#374151"/>
  <rect x="140" y="115" width="20" height="3" rx="1" fill="#3b82f6"/>
  <text x="165" y="118" font-family="monospace" font-size="8" fill="#3b82f6">B+</text>
  
  <rect x="55" y="125" width="75" height="3" rx="1" fill="#374151"/>
  <rect x="140" y="125" width="20" height="3" rx="1" fill="#f59e0b"/>
  <text x="165" y="128" font-family="monospace" font-size="8" fill="#f59e0b">B</text>
  
  <rect x="55" y="135" width="85" height="3" rx="1" fill="#374151"/>
  <rect x="140" y="135" width="20" height="3" rx="1" fill="#10b981"/>
  <text x="165" y="138" font-family="monospace" font-size="8" fill="#10b981">A-</text>
  
  <rect x="55" y="145" width="70" height="3" rx="1" fill="#374151"/>
  <rect x="140" y="145" width="20" height="3" rx="1" fill="#ef4444"/>
  <text x="165" y="148" font-family="monospace" font-size="8" fill="#ef4444">C+</text>
  
  <rect x="55" y="155" width="80" height="3" rx="1" fill="#374151"/>
  <rect x="140" y="155" width="20" height="3" rx="1" fill="#10b981"/>
  <text x="165" y="158" font-family="monospace" font-size="8" fill="#10b981">A</text>
  
  <rect x="55" y="165" width="75" height="3" rx="1" fill="#374151"/>
  <rect x="140" y="165" width="20" height="3" rx="1" fill="#3b82f6"/>
  <text x="165" y="168" font-family="monospace" font-size="8" fill="#3b82f6">B</text>
  
  <!-- Chart area -->
  <rect x="220" y="80" width="130" height="120" rx="4" fill="#ffffff" stroke="#e5e7eb"/>
  
  <!-- Chart title -->
  <rect x="225" y="85" width="80" height="6" rx="3" fill="#6d28d9"/>
  <rect x="225" y="95" width="60" height="4" rx="2" fill="#9ca3af"/>
  
  <!-- Bar chart -->
  <rect x="235" y="160" width="15" height="30" rx="2" fill="url(#chartGradient)"/>
  <rect x="255" y="140" width="15" height="50" rx="2" fill="url(#chartGradient)"/>
  <rect x="275" y="150" width="15" height="40" rx="2" fill="url(#chartGradient)"/>
  <rect x="295" y="130" width="15" height="60" rx="2" fill="url(#chartGradient)"/>
  <rect x="315" y="145" width="15" height="45" rx="2" fill="url(#chartGradient)"/>
  
  <!-- Chart labels -->
  <text x="240" y="205" font-family="Arial" font-size="6" fill="#6b7280">A</text>
  <text x="260" y="205" font-family="Arial" font-size="6" fill="#6b7280">B</text>
  <text x="280" y="205" font-family="Arial" font-size="6" fill="#6b7280">C</text>
  <text x="300" y="205" font-family="Arial" font-size="6" fill="#6b7280">D</text>
  <text x="320" y="205" font-family="Arial" font-size="6" fill="#6b7280">F</text>
  
  <!-- Statistics panel -->
  <rect x="225" y="110" width="120" height="20" rx="4" fill="#f3f4f6"/>
  <text x="230" y="118" font-family="Arial" font-size="6" fill="#374151">Average: 85.7%</text>
  <text x="230" y="125" font-family="Arial" font-size="6" fill="#374151">Pass Rate: 92%</text>
  
  <!-- Floating academic elements -->
  <circle cx="20" cy="100" r="12" fill="#ffffff" fill-opacity="0.3"/>
  <text x="16" y="105" font-family="Arial" font-size="10" fill="#8b5cf6" font-weight="bold">A+</text>
  
  <rect x="370" y="50" width="20" height="20" rx="4" fill="#ffffff" fill-opacity="0.3"/>
  <text x="375" y="62" font-family="Arial" font-size="8" fill="#6d28d9">📊</text>
  
  <circle cx="380" cy="180" r="10" fill="#ffffff" fill-opacity="0.2"/>
  <text x="376" y="185" font-family="Arial" font-size="8" fill="#8b5cf6">📈</text>
  
  <!-- Python/Data analysis indicators -->
  <rect x="10" y="200" width="80" height="30" rx="6" fill="#1f2937" fill-opacity="0.8"/>
  <text x="15" y="212" font-family="monospace" font-size="8" fill="#10b981">import pandas</text>
  <text x="15" y="220" font-family="monospace" font-size="8" fill="#3b82f6">import matplotlib</text>
  
  <!-- Grade distribution pie chart indicator -->
  <circle cx="50" cy="50" r="15" fill="#ffffff" fill-opacity="0.3"/>
  <path d="M50 35 A15 15 0 0 1 60 55 L50 50 Z" fill="#10b981"/>
  <path d="M60 55 A15 15 0 0 1 45 62 L50 50 Z" fill="#3b82f6"/>
  <path d="M45 62 A15 15 0 0 1 50 35 L50 50 Z" fill="#f59e0b"/>
</svg>
