<svg xmlns="http://www.w3.org/2000/svg" width="400" height="250" viewBox="0 0 400 250">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0284c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0369a1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cloudGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#f1f5f9;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="sunGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Sky background -->
  <rect width="400" height="250" fill="url(#skyGradient)"/>
  
  <!-- Sun -->
  <circle cx="320" cy="60" r="25" fill="url(#sunGradient)"/>
  <g stroke="#fbbf24" stroke-width="2" opacity="0.8">
    <line x1="290" y1="60" x2="275" y2="60"/>
    <line x1="350" y1="60" x2="365" y2="60"/>
    <line x1="320" y1="30" x2="320" y2="15"/>
    <line x1="320" y1="90" x2="320" y2="105"/>
    <line x1="298" y1="38" x2="287" y2="27"/>
    <line x1="342" y1="82" x2="353" y2="93"/>
    <line x1="298" y1="82" x2="287" y2="93"/>
    <line x1="342" y1="38" x2="353" y2="27"/>
  </g>
  
  <!-- Clouds -->
  <g fill="url(#cloudGradient)">
    <ellipse cx="80" cy="50" rx="25" ry="15"/>
    <ellipse cx="100" cy="45" rx="30" ry="18"/>
    <ellipse cx="120" cy="50" rx="20" ry="12"/>
    
    <ellipse cx="180" cy="80" rx="20" ry="12"/>
    <ellipse cx="195" cy="75" rx="25" ry="15"/>
    <ellipse cx="210" cy="80" rx="18" ry="10"/>
  </g>
  
  <!-- Weather app interface -->
  <rect x="50" y="100" width="300" height="130" rx="15" fill="#ffffff" fill-opacity="0.95"/>
  
  <!-- Current weather card -->
  <rect x="70" y="120" width="120" height="90" rx="8" fill="#0ea5e9" fill-opacity="0.1" stroke="#0ea5e9" stroke-opacity="0.3"/>
  <rect x="80" y="130" width="60" height="6" rx="3" fill="#0ea5e9"/>
  <rect x="80" y="142" width="45" height="4" rx="2" fill="#64748b"/>
  
  <!-- Temperature display -->
  <text x="85" y="170" font-family="Arial" font-size="24" font-weight="bold" fill="#0369a1">25°</text>
  <circle cx="130" cy="165" r="12" fill="#fbbf24"/>
  <rect x="80" y="185" width="80" height="3" rx="1" fill="#64748b"/>
  <rect x="80" y="192" width="60" height="3" rx="1" fill="#64748b"/>
  
  <!-- Forecast cards -->
  <rect x="210" y="120" width="50" height="40" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
  <circle cx="235" cy="135" r="6" fill="#6b7280"/>
  <rect x="220" y="145" width="30" height="3" rx="1" fill="#374151"/>
  <rect x="225" y="152" width="20" height="2" rx="1" fill="#64748b"/>
  
  <rect x="270" y="120" width="50" height="40" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
  <ellipse cx="295" cy="135" rx="8" ry="4" fill="#94a3b8"/>
  <ellipse cx="285" cy="132" rx="6" ry="3" fill="#cbd5e1"/>
  <rect x="280" y="145" width="30" height="3" rx="1" fill="#374151"/>
  <rect x="285" y="152" width="20" height="2" rx="1" fill="#64748b"/>
  
  <rect x="210" y="170" width="50" height="40" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
  <circle cx="235" cy="185" r="6" fill="#3b82f6"/>
  <circle cx="230" cy="181" r="3" fill="#60a5fa" fill-opacity="0.7"/>
  <circle cx="240" cy="181" r="3" fill="#60a5fa" fill-opacity="0.7"/>
  <rect x="220" y="195" width="30" height="3" rx="1" fill="#374151"/>
  <rect x="225" y="202" width="20" height="2" rx="1" fill="#64748b"/>
  
  <rect x="270" y="170" width="50" height="40" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
  <path d="M285 185 Q295 180 305 185 Q295 190 285 185" fill="#ef4444"/>
  <rect x="280" y="195" width="30" height="3" rx="1" fill="#374151"/>
  <rect x="285" y="202" width="20" height="2" rx="1" fill="#64748b"/>
  
  <!-- Search bar -->
  <rect x="70" y="240" width="200" height="20" rx="10" fill="#f1f5f9" stroke="#e2e8f0"/>
  <circle cx="80" cy="250" r="4" fill="#64748b"/>
  <rect x="90" y="247" width="100" height="3" rx="1" fill="#cbd5e1"/>
  
  <!-- Location pin -->
  <circle cx="300" cy="250" r="8" fill="#ef4444"/>
  <circle cx="300" cy="248" r="3" fill="#ffffff"/>
  
  <!-- Weather icons floating -->
  <circle cx="30" cy="180" r="15" fill="#ffffff" fill-opacity="0.3"/>
  <circle cx="35" cy="175" r="8" fill="#fbbf24" fill-opacity="0.8"/>
  
  <ellipse cx="370" cy="200" rx="12" ry="6" fill="#ffffff" fill-opacity="0.4"/>
  <ellipse cx="365" cy="198" rx="8" ry="4" fill="#94a3b8" fill-opacity="0.8"/>
</svg>
