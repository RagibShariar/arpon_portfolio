<svg xmlns="http://www.w3.org/2000/svg" width="400" height="250" viewBox="0 0 400 250">
  <defs>
    <linearGradient id="courseGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1d4ed8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="formGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="250" fill="url(#courseGradient)"/>
  
  <!-- University building silhouette -->
  <rect x="30" y="180" width="340" height="40" fill="#1e3a8a" fill-opacity="0.6"/>
  <rect x="50" y="160" width="60" height="60" fill="#1e3a8a" fill-opacity="0.8"/>
  <rect x="130" y="140" width="80" height="80" fill="#1e3a8a" fill-opacity="0.8"/>
  <rect x="230" y="150" width="70" height="70" fill="#1e3a8a" fill-opacity="0.8"/>
  <rect x="320" y="170" width="50" height="50" fill="#1e3a8a" fill-opacity="0.8"/>
  
  <!-- Windows in buildings -->
  <rect x="60" y="170" width="8" height="12" fill="#fbbf24"/>
  <rect x="75" y="170" width="8" height="12" fill="#fbbf24"/>
  <rect x="90" y="170" width="8" height="12" fill="#fbbf24"/>
  <rect x="145" y="155" width="8" height="12" fill="#fbbf24"/>
  <rect x="160" y="155" width="8" height="12" fill="#fbbf24"/>
  <rect x="175" y="155" width="8" height="12" fill="#fbbf24"/>
  <rect x="190" y="155" width="8" height="12" fill="#fbbf24"/>
  <rect x="245" y="165" width="8" height="12" fill="#fbbf24"/>
  <rect x="260" y="165" width="8" height="12" fill="#fbbf24"/>
  <rect x="275" y="165" width="8" height="12" fill="#fbbf24"/>
  
  <!-- Main interface -->
  <rect x="50" y="40" width="300" height="180" rx="8" fill="#ffffff" fill-opacity="0.95"/>
  
  <!-- Header -->
  <rect x="50" y="40" width="300" height="40" rx="8" fill="#1e40af"/>
  <rect x="65" y="52" width="120" height="16" rx="8" fill="#ffffff"/>
  <circle cx="320" cy="60" r="8" fill="#ffffff" fill-opacity="0.8"/>
  
  <!-- Course cards -->
  <rect x="70" y="100" width="120" height="80" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="80" y="110" width="80" height="8" rx="4" fill="url(#formGradient)"/>
  <rect x="80" y="125" width="60" height="4" rx="2" fill="#64748b"/>
  <rect x="80" y="135" width="70" height="4" rx="2" fill="#64748b"/>
  <rect x="80" y="145" width="50" height="4" rx="2" fill="#64748b"/>
  <rect x="80" y="160" width="40" height="12" rx="6" fill="#10b981"/>
  
  <rect x="210" y="100" width="120" height="80" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="220" y="110" width="90" height="8" rx="4" fill="url(#formGradient)"/>
  <rect x="220" y="125" width="70" height="4" rx="2" fill="#64748b"/>
  <rect x="220" y="135" width="80" height="4" rx="2" fill="#64748b"/>
  <rect x="220" y="145" width="60" height="4" rx="2" fill="#64748b"/>
  <rect x="220" y="160" width="45" height="12" rx="6" fill="#f59e0b"/>
  
  <!-- Student list -->
  <circle cx="85" cy="205" r="8" fill="#06b6d4"/>
  <rect x="100" y="200" width="60" height="4" rx="2" fill="#334155"/>
  <rect x="100" y="208" width="40" height="3" rx="1" fill="#64748b"/>
  
  <circle cx="205" cy="205" r="8" fill="#8b5cf6"/>
  <rect x="220" y="200" width="65" height="4" rx="2" fill="#334155"/>
  <rect x="220" y="208" width="45" height="3" rx="1" fill="#64748b"/>
  
  <!-- Floating icons -->
  <circle cx="360" cy="120" r="12" fill="#ffffff" fill-opacity="0.3"/>
  <rect x="355" y="115" width="10" height="10" rx="2" fill="#3b82f6" fill-opacity="0.7"/>
  
  <circle cx="30" cy="100" r="10" fill="#ffffff" fill-opacity="0.2"/>
</svg>
