<svg xmlns="http://www.w3.org/2000/svg" width="400" height="250" viewBox="0 0 400 250">
  <defs>
    <linearGradient id="taskGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ea580c;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="250" fill="url(#taskGradient)"/>
  
  <!-- Phone/App mockup -->
  <rect x="120" y="20" width="160" height="210" rx="20" fill="#1f2937"/>
  <rect x="130" y="35" width="140" height="180" rx="8" fill="#ffffff"/>
  
  <!-- Header -->
  <rect x="130" y="35" width="140" height="35" rx="8" fill="#047857"/>
  <rect x="140" y="45" width="60" height="8" rx="4" fill="#ffffff"/>
  <rect x="140" y="56" width="40" height="6" rx="3" fill="#ffffff" fill-opacity="0.8"/>
  <circle cx="250" cy="52" r="6" fill="#ffffff" fill-opacity="0.9"/>
  
  <!-- Task items -->
  <!-- Completed task -->
  <rect x="140" y="85" width="120" height="25" rx="4" fill="#f0fdf4" stroke="#bbf7d0"/>
  <circle cx="150" cy="97" r="4" fill="#10b981"/>
  <path d="M147 97 L149 99 L153 95" stroke="#ffffff" stroke-width="1.5" fill="none"/>
  <rect x="160" y="92" width="70" height="3" rx="1" fill="#374151" fill-opacity="0.6"/>
  <rect x="160" y="99" width="50" height="2" rx="1" fill="#6b7280" fill-opacity="0.6"/>
  
  <!-- In progress task -->
  <rect x="140" y="115" width="120" height="25" rx="4" fill="#fef3c7" stroke="#fde68a"/>
  <circle cx="150" cy="127" r="4" fill="#f59e0b"/>
  <rect x="160" y="122" width="80" height="3" rx="1" fill="#374151"/>
  <rect x="160" y="129" width="60" height="2" rx="1" fill="#6b7280"/>
  
  <!-- Pending task -->
  <rect x="140" y="145" width="120" height="25" rx="4" fill="#fef2f2" stroke="#fecaca"/>
  <circle cx="150" cy="157" r="4" fill="#ef4444"/>
  <rect x="160" y="152" width="75" height="3" rx="1" fill="#374151"/>
  <rect x="160" y="159" width="55" height="2" rx="1" fill="#6b7280"/>
  
  <!-- Priority task -->
  <rect x="140" y="175" width="120" height="25" rx="4" fill="#f3e8ff" stroke="#ddd6fe"/>
  <circle cx="150" cy="187" r="4" fill="#8b5cf6"/>
  <rect x="160" y="182" width="85" height="3" rx="1" fill="#374151"/>
  <rect x="160" y="189" width="65" height="2" rx="1" fill="#6b7280"/>
  <rect x="235" y="180" width="20" height="8" rx="4" fill="url(#cardGradient)"/>
  
  <!-- Add button -->
  <circle cx="240" cy="195" r="12" fill="#047857"/>
  <rect x="237" y="189" width="6" height="12" rx="1" fill="#ffffff"/>
  <rect x="234" y="192" width="12" height="6" rx="1" fill="#ffffff"/>
  
  <!-- Floating task cards -->
  <rect x="30" y="50" width="60" height="40" rx="6" fill="#ffffff" fill-opacity="0.9" transform="rotate(-5)"/>
  <rect x="35" y="58" width="40" height="3" rx="1" fill="#6b7280"/>
  <rect x="35" y="65" width="30" height="2" rx="1" fill="#9ca3af"/>
  <circle cx="70" cy="75" r="3" fill="#10b981"/>
  
  <rect x="310" y="80" width="60" height="40" rx="6" fill="#ffffff" fill-opacity="0.9" transform="rotate(8)"/>
  <rect x="315" y="88" width="45" height="3" rx="1" fill="#6b7280"/>
  <rect x="315" y="95" width="35" height="2" rx="1" fill="#9ca3af"/>
  <circle cx="350" cy="105" r="3" fill="#f59e0b"/>
  
  <!-- Calendar icon -->
  <rect x="50" y="160" width="30" height="30" rx="4" fill="#ffffff" fill-opacity="0.8"/>
  <rect x="50" y="160" width="30" height="8" rx="4" fill="#3b82f6"/>
  <circle cx="58" cy="175" r="2" fill="#3b82f6"/>
  <circle cx="65" cy="175" r="2" fill="#ef4444"/>
  <circle cx="72" cy="175" r="2" fill="#10b981"/>
  <circle cx="58" cy="182" r="2" fill="#6b7280"/>
  <circle cx="65" cy="182" r="2" fill="#6b7280"/>
</svg>
